# ═══════════════════════════════════════════════════════════════════════════
# OPTIMIZED GEONODE-K8S DEPLOYMENT VALUES
# Single Helm release controls the entire stack
# ═══════════════════════════════════════════════════════════════════════════

global:
  storageClass: longhorn
  accessMode: ReadWriteMany
  namespace: rheticus-electric-towers

  # ═════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE TAINTS & TOLERATIONS (cluster-wide)
  # ═════════════════════════════════════════════════════════════════════════
  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

  # ═════════════════════════════════════════════════════════════════════════
  # TLS/INGRESS CONFIGURATION (consolidates apisix-tls.yaml)
  # ═════════════════════════════════════════════════════════════════════════
  ingress:
    enabled: true
    ingressClassName: apisix
    domain: relect.planetek.it
    scheme: https
    tls:
      enabled: true
      secretName: geonode-tls-secret
      # Provide cert/key inline OR leave empty to skip (manual secret creation)
      cert: ""  # base64-encoded certificate
      key: ""   # base64-encoded private key

# ═══════════════════════════════════════════════════════════════════════════
# CNPG POSTGRESQL CLUSTER CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════
cnpg:
  enabled: true
  # Cluster metadata
  clusterName: cluster-pg
  # Database image with PostGIS
  imageName: ghcr.io/cloudnative-pg/postgis:15
  instances: 3
  
  # Storage configuration
  storage:
    size: 1Gi
    storageClass: longhorn
  
  # Resource limits
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  
  # Node affinity with taints
  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"
  
  # Database initialization (creates users & databases on first deploy)
  initdb:
    enabled: true
    # Scripts run only on cluster creation; use separate job for schema updates
    scripts:
      - name: init-geonode-geodata
        # Creates geonode and geodata users with passwords
        # PostGIS extensions installed via bootstrap script
        database: postgres
        owner: postgres

# ═══════════════════════════════════════════════════════════════════════════
# DATABASE CREDENTIALS (replaces manual secret creation)
# These are rendered into the CNPG init secret
# ═══════════════════════════════════════════════════════════════════════════
database:
  postgres:
    user: postgres
    password: "vcebJmiGBeY62jTAmGV7zA7DjvkOpy7FnYuk1gf59ABqGThPSDRO8XIRAE8bxjwc" # Merged fallback password from File 2
  geonode:
    user: geonode
    database: geonode
    password: "geonode-secret"
  geodata:
    user: geodata
    database: geodata
    password: "geodata-secret"

# ═══════════════════════════════════════════════════════════════════════════
# GEONODE CORE CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════
geonode:
  replicaCount: 1

  persistant:
    storageSize: 2Gi

  general:
    debug: false
    debug_static: false
    externalScheme: https
    externalDomain: relect.planetek.it
    
    # Django settings additions (replaces manual env var injection)
    # This is rendered into geonode-k8s-settings-additions.py
    settings_additions: |
      # ─────────────────────────────────────────────────────────────
      # PROXY & HTTPS CONFIGURATION
      # ─────────────────────────────────────────────────────────────
      CSRF_TRUSTED_ORIGINS = ['https://relect.planetek.it']
      ALLOWED_HOSTHosts = ['relect.planetek.it', 'django', '*']
      
      # Trust X-Forwarded headers from APISIX proxy
      USE_X_FORWARDED_HOST = True
      SECURE_PROXY_SSL_HEADER = ("HTTP_X_FORWARDED_PROTO", "https")
      
      # ─────────────────────────────────────────────────────────────
      # COOKIE & CSRF SECURITY
      # ─────────────────────────────────────────────────────────────
      CSRF_COOKIE_SECURE = True
      CSRF_COOKIE_HTTPONLY = True
      CSRF_COOKIE_SAMESITE = 'Lax'
      
      SESSION_COOKIE_SECURE = True
      SESSION_COOKIE_HTTPONLY = True
      SESSION_COOKIE_SAMESITE = 'Lax'
      
      # Allow credentials in cross-origin requests (for React frontend)
      CORS_ALLOW_CREDENTIALS = True
      CORS_ALLOWED_ORIGINS = ['https://relect.planetek.it']
      
      # ─────────────────────────────────────────────────────────────
      # AUTHENTICATION & OAUTH2
      # ─────────────────────────────────────────────────────────────
      # OAuth2 callback URI will be updated by init-db-job
      ACCOUNT_EMAIL_VERIFICATION = 'optional'

  resources:
    limits:
      cpu: "1500m"
      memory: "1536Mi"
    requests:
      cpu: "500m"
      memory: "512Mi"

  ingress:
    enabled: false  # Managed by APISIX, not K8s Ingress

  secret:
    superUser:
      username: admin
      password: "geonode"
      email: admin@example.com

  mail:
    enabled: false

  ldap:
    enabled: false

  register:
    open_signup: true
    email_verification: "False"
    authentication_method: username_email

  # HEALTHCHECKS
  startupProbe:
    httpGet:
      path: /
      port: http-monitor # port 8001 (uwsgi stats)
    failureThreshold: 30 # 30 × 10s = 5 min max startup
    periodSeconds: 10

  livenessProbe:
    httpGet:
      path: /
      port: http-monitor
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: http-monitor
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# ═══════════════════════════════════════════════════════════════════════════
# GEOSERVER CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════
geoserver:
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "3Gi"
      cpu: "2000m"

# ═══════════════════════════════════════════════════════════════════════════
# PYCSW CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════
pycsw:
  enabled: true
  config: |-
    [server]
        home=/home/pycsw
        url=${PYCSW_SERVER_URL}
        mimetype=application/xml; charset=UTF-8
        encoding=UTF-8
        language=en-US
        maxrecords=10
        workers=2
        gzip_compresslevel=5
        pretty_print=true
        domainquerytype=range
        domaincounts=true
        profiles=apiso,ebrim
        timeout=30
    [manager]
        transactions=true
    [metadata:main]
        identification_title=GeoNode pycsw Geospatial Catalogue
        identification_abstract=GeoNode-k8s pycsw Geospatial Catalogue
        identification_keywords=catalogue,discovery,metadata,geonode
        identification_keywords_type=theme
        identification_fees=None
        identification_accessconstraints=None
        provider_name=GeoNode Kubernetes
        provider_url=${GEONODE_SITE_URL}
        contact_name=Lastname, Firstname
        contact_position=Position Title
        contact_address=Mailing Address
        contact_city=City
        contact_stateorprovince=Administrative Area
        contact_postalcode=Zip or Postal Code
        contact_country=Country
        contact_phone=+xx-xxx-xxx-xxxx
        contact_fax=+xx-xxx-xxx-xxxx
        contact_email=Email Address
        contact_url=Contact URL
        contact_hours=Hours of Service
        contact_instructions=During hours of service. Off on weekends.
        contact_role=pointOfContact
    [repository]
        database=${PYCSW_REPOSITORY_DATABASE_URI}
        mappings=/etc/pycsw/pycsw-mappings.py
        table=base_resourcebase
    [metadata:inspire]
        enabled=true
        languages_supported=eng,gre
        default_language=eng
        date=YYYY-MM-DD
        gemet_keywords=Utility and governmental services
        conformity_service=notEvaluated
        contact_name=Organization Name
        contact_email=Email Address
        temp_extent=YYYY-MM-DD/YYYY-MM-DD

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "500m"

  # HEALTHCHECKS
  readinessProbe:
    httpGet:
      path: /
      port: 8000
    initialDelaySeconds: 15   # give workers time to fork
    periodSeconds: 10
    timeoutSeconds: 10        # was 5
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /
      port: 8000
    initialDelaySeconds: 30      # allow time for startup
    timeoutSeconds: 10           # tolerate slow responses
    periodSeconds: 15
    failureThreshold: 5          # more tolerance for GC pauses

# ═══════════════════════════════════════════════════════════════════════════
# RABBITMQ CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════
rabbitmq:
  enabled: true
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "500m"
  persistence:
    enabled: true
    size: 2Gi
  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

# ═══════════════════════════════════════════════════════════════════════════
# MEMCACHED CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════
memcached:
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  config:
    memoryLimit: 96        # keep under the container limit (in MB)
  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

# ═══════════════════════════════════════════════════════════════════════════
# POSTGRES CONFIGURATION (geonode-k8s chart integration)
# Point to external CNPG cluster managed in this same Helm release
# ═══════════════════════════════════════════════════════════════════════════
postgres-operator:
  enabled: false  # -- Disable the bundled Zalando operator entirely; we use CNPG

postgres:
  type: external
  username: app # match CNPG's app user
  geonode_databasename_and_username: geonode
  geodata_databasename_and_username: geodata
  schema: public

  external:
    # CNPG cluster-pg creates three services: -rw (primary), -ro (replica), -r (any)
    # Use -rw for writes (migrations, init-db-job)
    hostname: cluster-pg-rw
    port: 5432
    ssl: prefer
    secret:
      # existingSecretName: "geonode-postgres-creds"  # Optional: use pre-created secret
      # -- if not using an existing Secret, the operator will create a Secret with this name and the following keys
      postgres_password: "vcebJmiGBeY62jTAmGV7zA7DjvkOpy7FnYuk1gf59ABqGThPSDRO8XIRAE8bxjwc" 
      geonode_password: "geonode-secret"  
      geodata_password: "geodata-secret"  

# ═══════════════════════════════════════════════════════════════════════════
# WEBGIS REACT FRONTEND (consolidates pk-client.yaml)
# Managed entirely by geonode-k8s chart under templates/webgis/
# ═══════════════════════════════════════════════════════════════════════════
webgis:
  enabled: true
  replicaCount: 1
  image:
    name: harbor.planetek.it/rheticus_electric_towers/rheticus-electric-towers-web-gis
    tag: latest
    pullPolicy: Always
  
  service:
    name: webgis
    port: 80
    targetPort: 80
  
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  
  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
  
  env:
    ADMIN_USERNAME: admin
    # ADMIN_PASSWORD loaded from webgis-client-creds secret (created separately or via Helm)
  
  # ─────────────────────────────────────────────────────────────
  # NGINX REVERSE PROXY CONFIG (runs inside webgis pod)
  # ─────────────────────────────────────────────────────────────
  nginxConfig: |
    server {
      listen 80;
      server_name _;
      
      root /app;
      index index.html;
      
      location / {
        try_files $uri $uri/ /index.html;
        expires 30d;
        add_header Cache-Control "public, immutable";
      }
      
      location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }
      
      # Proxy API calls to GeoNode backend (via APISIX)
      # React frontend at /webgis/ makes API calls to /api/
      # APISIX routes /api/ to geonode-nginx (internal)
      location /api/ {
        proxy_pass https://relect.planetek.it/api/;
        proxy_set_header Host relect.planetek.it;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
      }
    }
  
  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

# ═══════════════════════════════════════════════════════════════════════════
# APISIX ROUTING CONFIGURATION (consolidates apisix-route.yaml)
# Managed as Kubernetes CRDs alongside this Helm release
# ═══════════════════════════════════════════════════════════════════════════
apisix:
  enabled: true
  routes:
    # Route 1: WebGIS frontend
    - name: webgis-route
      hosts:
        - relect.planetek.it
      paths:
        - /webgis
        - /webgis/*
      backends:
        - serviceName: webgis
          servicePort: 80
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            headers:
              X-Forwarded-Proto: "https"
    
    # Route 2: GeoNode backend (API, Django admin, etc.)
    - name: geonode-route-root
      hosts:
        - relect.planetek.it
      paths:
        - /
        - /*
        - /**
      backends:
        - serviceName: geonode-nginx
          servicePort: 80
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            headers:
              X-Forwarded-Proto: "https"
    
    # Route 3: GeoServer WMS/WFS
    - name: geoserver-route
      hosts:
        - relect.planetek.it
      paths:
        - /geoserver
        - /geoserver/*
      backends:
        - serviceName: geonode-geoserver
          servicePort: 8080
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            headers:
              X-Forwarded-Proto: "https"

# ═══════════════════════════════════════════════════════════════════════════
# IMAGE PULL SECRETS (consolidates manual secret creation)
# ═══════════════════════════════════════════════════════════════════════════
imagePullSecrets:
  - name: rheticus-electric-towers-pull-secret

# ═══════════════════════════════════════════════════════════════════════════
# UNUSED SUBSYSTEMS
# ═══════════════════════════════════════════════════════════════════════════
redis:
  enabled: false  # GeoNode 5.0.1 uses RabbitMQ, not Redis

# ═══════════════════════════════════════════════════════════════════════════
# NGINX INGRESS CONTROLLER CONFIG (internal, manages /static, /media, etc.)
# Part of geonode-k8s chart; configuration is already optimal
# ═══════════════════════════════════════════════════════════════════════════
nginx:
  replicaCount: 1
  geonodeMaxClientBodySize: 2000M
  geoServerMaxClientBodySize: 10G
  pycswMaxClientBodySize: 100M
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "800m"
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 50
    timeoutSeconds: 5