# ═══════════════════════════════════════════════════════════════════════════
# VALUES (With Secured Reference Strings)
# ═══════════════════════════════════════════════════════════════════════════

global:
  storageClass: longhorn
  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

# ═══════════════════════════════════════════════════════════════════════════
# POSTGRES & CNPG CONFIGURATION (Merged into a single block)
# ═══════════════════════════════════════════════════════════════════════════
postgres:
  enabled: true
  type: external  # Keep as "external" to indicate CNPG cluster managed by this chart
  username: app
  geonode_databasename_and_username: geonode
  geodata_databasename_and_username: geodata

postgres:
  enabled: true
  type: external  # Tells the chart we are supplying or building an external-style CNPG block
  
  cnpg:
    enabled: true
    clusterName: cluster-pg
    imageName: ghcr.io/cloudnative-pg/postgis:15
    instances: 3
    storage:
      size: 10Gi
      storageClass: longhorn
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    backup:
      enabled: false

  bootstrap:
    initdb:
      database: app   # This creates the default 'app' user/db
      owner: app
      scripts:
        - name: 01-init-roles-and-dbs
          database: postgres
          owner: postgres
          content: |
            -- Create dedicated users
            CREATE USER geonode WITH PASSWORD 'geonode-secret' CREATEDB LOGIN;
            CREATE USER geodata WITH PASSWORD 'geodata-secret' CREATEDB LOGIN;
            
            -- Create the two required databases
            CREATE DATABASE geonode OWNER geonode;
            CREATE DATABASE geodata OWNER geodata;
            
            -- Grant privileges to the default app user
            GRANT ALL PRIVILEGES ON DATABASE geonode TO app;
            GRANT ALL PRIVILEGES ON DATABASE geodata TO app;

        - name: 02-setup-geonode-extensions
          database: geonode
          owner: postgres
          content: |
            CREATE EXTENSION IF NOT EXISTS postgis;
            CREATE EXTENSION IF NOT EXISTS postgis_topology;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO geonode;
            GRANT ALL ON SCHEMA public TO geonode;
            GRANT ALL ON SCHEMA public TO app;

        - name: 03-setup-geodata-extensions
          database: geodata
          owner: postgres
          content: |
            CREATE EXTENSION IF NOT EXISTS postgis;
            CREATE EXTENSION IF NOT EXISTS postgis_topology;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO geodata;
            GRANT ALL ON SCHEMA public TO geodata;
            GRANT ALL ON SCHEMA public TO app;

  # External connection (for when CNPG cluster is external)
  external:
    hostname: cluster-pg-rw
    port: 5432
    ssl: prefer
    secret:
      existingSecretName: ""  # Keeps your working template pattern intact
      postgres_password: "rheticus_electric_tower/data/postgres#password"
      geonode_password: "rheticus_electric_tower/data/geonode#password"
      geodata_password: "rheticus_electric_tower/data/geodata#password"

  # External endpoints config
  # external:
  #   hostname: cluster-pg-rw
  #   port: 5432
  #   ssl: prefer

  # # KEEPING VAULT REFERENCES
  secret:
    postgres-password: "rheticus_electric_tower/data/postgres#password"
  geonode: 
    secret: 
      geonode-password: "rheticus_electric_tower/data/geonode#password"
  geodata: 
    secret: 
      geodata-password: "rheticus_electric_tower/data/geodata#password"

  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

geonode:
  replicaCount: 1
  persistant:
    storageSize: 2Gi
  general:
    debug: True
    debug_static: True
    externalScheme: https
    externalDomain: relect.planetek.it  

  resources:
    limits:
      cpu: "1500m"
      memory: "1536Mi"
    requests:
      cpu: "500m"
      memory: "512Mi"

  ingress:
    enabled: False  
  
  # KEEPING VAULT REFERENCES (Quoted to protect the '#' character)
  secret:
    existingSecretName: "geonode-secret"
    data: 
      username: "rheticus_electric_tower/data/geonode#username"
      password: "rheticus_electric_tower/data/geonode#password"
      email: "rheticus_electric_tower/data/geonode#email"

  mail:
    enabled: False
  ldap:
    enabled: False

  register:
    open_signup: True
    email_verification: "False"
    authentication_method: username_email
 
  startupProbe:
    httpGet:
      path: /
      port: http-monitor
    failureThreshold: 30
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /
      port: http-monitor
    initialDelaySeconds: 0 
    periodSeconds: 30     
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http-monitor
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

geoserver:
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "3Gi"
      cpu: "2000m"
  
  # KEEPING VAULT REFERENCES
  secret: 
    existingSecretName: "geoserver-secret"
    data: 
      GEOSERVER_ADMIN_USER: "rheticus_electric_tower/data/geoserver#GEOSERVER_ADMIN_USER"
      GEOSERVER_ADMIN_PASSWORD: "rheticus_electric_tower/data/geoserver#GEOSERVER_ADMIN_PASSWORD"
      GEOSERVER_FACTORY_PASSWORD: "rheticus_electric_tower/data/geoserver#GEOSERVER_FACTORY_PASSWORD"
      OAUTH2_API_KEY: "rheticus_electric_tower/data/geoserver#OAUTH2_API_KEY"
      OAUTH2_CLIENT_ID: "rheticus_electric_tower/data/geoserver#OAUTH2_CLIENT_ID"
      OAUTH2_CLIENT_SECRET: "rheticus_electric_tower/data/geoserver#OAUTH2_CLIENT_SECRET"

  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

pycsw:
  enabled: True
  config: |-
    [server]
        home=/home/pycsw
        url=${PYCSW_SERVER_URL}
        mimetype=application/xml; charset=UTF-8
        encoding=UTF-8
        language=en-US
        maxrecords=10
        workers=2
        gzip_compresslevel=5
        pretty_print=true
        domainquerytype=range
        domaincounts=true
        profiles=apiso,ebrim
        timeout=30
    [manager]
        transactions=true
    [metadata:main]
        identification_title=GeoNode pycsw Geospatial Catalogue
        identification_abstract=GeoNode-k8s pycsw Geospatial Catalogue
        identification_keywords=catalogue,discovery,metadata,geonode
        identification_keywords_type=theme
        identification_fees=None
        identification_accessconstraints=None
        provider_name=GeoNode Kubernetes
        provider_url=${GEONODE_SITE_URL}
        contact_name=Lastname, Firstname
        contact_position=Position Title
        contact_address=Mailing Address
        contact_city=City
        contact_stateorprovince=Administrative Area
        contact_postalcode=Zip or Postal Code
        contact_country=Country
        contact_phone=+xx-xxx-xxx-xxxx
        contact_fax=+xx-xxx-xxx-xxxx
        contact_email=Email Address
        contact_url=Contact URL
        contact_hours=Hours of Service
        contact_instructions=During hours of service. Off on weekends.
        contact_role=pointOfContact
    [repository]
        database=${PYCSW_REPOSITORY_DATABASE_URI}
        mappings=/etc/pycsw/pycsw-mappings.py
        table=base_resourcebase
    [metadata:inspire]
        enabled=true
        languages_supported=eng,gre
        default_language=eng
        date=YYYY-MM-DD
        gemet_keywords=Utility and governmental services
        conformity_service=notEvaluated
        contact_name=Organization Name
        contact_email=Email Address
        temp_extent=YYYY-MM-DD/YYYY-MM-DD

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "500m"
  
  readinessProbe:
    httpGet:
      path: /
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /
      port: 8000
    initialDelaySeconds: 30
    timeoutSeconds: 10
    periodSeconds: 15
    failureThreshold: 5
  
  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

postgres-operator:
  enabled: False

