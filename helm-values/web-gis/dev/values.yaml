# ═══════════════════════════════════════════════════════════════════════════
# GEONODE-K8S HELM VALUES (Rheticus Electric Towers - Development)
# Repository: https://github.com/GeoNodeUserGroup-DE/geonode-k8s
# ═══════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════
# GLOBAL SETTINGS
# ═══════════════════════════════════════════════════════════════════════════
global:
  # Storage class for PVCs
  storageClass: longhorn
  accessMode: ReadWriteMany

  # Node tolerations - all pods must tolerate the cluster taint
  # The cluster has: key=cluster, value=rheticuset_cluster, effect=NoSchedule
  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

# ═══════════════════════════════════════════════════════════════════════════
# POSTGRESQL (CNPG Cluster + GeoNode Connection Settings)
# ═══════════════════════════════════════════════════════════════════════════
postgres:
  # 1. Configuration for the Helm Chart template to build/adopt the CNPG Cluster
  cnpg:
    enabled: true
    clusterName: cluster-pg   # Template generates: cluster-pg-app secret
    imageName: ghcr.io/cloudnative-pg/postgis:15
    instances: 3
    storage:
      size: 10Gi
      storageClass: longhorn
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
    # This matches the custom parameters injected via your chart template edit
    postgresql:
      parameters:
        log_statement: "mod"
        log_duration: "on"
        log_min_duration_statement: "1000"
        autovacuum: "on"
        autovacuum_max_workers: "3"

  # 2. Configuration for GeoNode core components to CONNECT to that cluster
  enabled: true
  type: external
  username: app
  geonode_databasename_and_username: geonode
  geodata_databasename_and_username: geodata
  schema: public
  bootstrap: 
    initdb: 
      database: app 
      owner: app

  external:
    hostname: rhet-dev-release-cnpg-rw
    port: 5432
    ssl: prefer
    secret:
      existingSecretName: "cluster-pg-app"
      data: 
        username: rheticus_electric_tower/data/postgres#username
        password: rheticus_electric_tower/data/postgres#password
  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

# ═══════════════════════════════════════════════════════════════════════════
# GEONODE DJANGO APPLICATION
# ═══════════════════════════════════════════════════════════════════════════
geonode:
  version: 5.0.1
  replicaCount: 1

  # Persistent storage
  persistant:
    storageSize: 2Gi

  # Container image
  image:
    name: geonode/geonode
    tag: "5.0.1"
  imagePullPolicy: IfNotPresent
  imagePullSecret: "rheticus-electric-towers-pull-secret"

  # Resource allocation
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 1536Mi

  # Django configuration
  general:
    # External domain and scheme (CRITICAL for APISIX reverse proxy)
    externalScheme: https
    externalDomain: relect.planetek.it

    # Debug mode (set to false in production)
    debug: false
    debug_static: false

    # API configuration
    api_limit_per_page: 1000
    geonode_project: geonode
    settings_module: geonode.settings

    # ────────────────────────────────────────────────────────────────────
    # CRITICAL: CSRF + Proxy Headers for APISIX Integration
    # ────────────────────────────────────────────────────────────────────
    # These settings ensure Django accepts requests from APISIX reverse proxy
    # while maintaining CSRF protection.
    settings_additions: |
      # ─ X-Forwarded-* Headers Trust ─
      # APISIX forwards the original client IP and protocol
      USE_X_FORWARDED_HOST = True
      USE_X_FORWARDED_PROTO = True
      SECURE_PROXY_SSL_HEADER = ('HTTP_X_FORWARDED_PROTO', 'https')

      # ─ CSRF Configuration ─
      CSRF_TRUSTED_ORIGINS = ['https://relect.planetek.it', 'http://localhost:8000']
      ALLOWED_HOSTS = ['*']
      # ALLOWED_HOSTS = [
      #     'relect.planetek.it',
      #     'localhost',
      #     '127.0.0.1',
      #     'rhet-dev-release-nginx', 
      #     'rhet-dev-release-geonode',
      # ]

      # ─ Cookie Configuration ─
      # Allow cookies across subdomains (future multi-tenant setup)
      CSRF_COOKIE_DOMAIN = '.relect.planetek.it'
      CSRF_COOKIE_SECURE = True
      CSRF_COOKIE_HTTPONLY = False  # Required for JS to read CSRF token
      CSRF_COOKIE_SAMESITE = 'Lax'

      SESSION_COOKIE_DOMAIN = '.relect.planetek.it'
      SESSION_COOKIE_SECURE = True
      SESSION_COOKIE_HTTPONLY = True
      SESSION_COOKIE_SAMESITE = 'Lax'

      # ─ OAuth2 for GeoServer ─
      OAUTH2_CLIENT_ID = 'Jrchz2oPY3akmzndmgUTYrs9gczlgoV20YPSvqaV'
      OAUTH2_CLIENT_SECRET = 'rCnp5txobUo83EpQEblM8fVj3QT5zb5qRfxNsuPzCqZaiRyIoxM4jdgMiZKFfePBHYXCLd7B8NlkfDBY9HKeIQPcy5Cp08KQNpRHQbjpLItDHv12GvkSeXp6OxaUETv3'

      # ─ Site Configuration ─
      # Used by OAuth2 redirect URIs and other absolute URL generation
      SITE_HOST_SCHEMA = 'https'

    # Upload settings
    upload:
      size: "2097152000"              # 2GB in bytes
      anonymous_view_permission: "True"
      anonymous_download_permission: "True"
      max_parallel_uploads_per_user: 10
      document_size: 60               # MB

  secret:
    existingSecretName: "cnpg-geonode-secret"
    data: 
      username: rheticus_electric_tower/data/geonode#username
      password: rheticus_electric_tower/data/geonode#password
      geonode-password: rheticus_electric_tower/data/geonode#password
      email: rheticus_electric_tower/data/geonode#email

  # Kubernetes Ingress (disabled - using APISIX instead)
  ingress:
    enabled: false

  # Probes for pod health
  startupProbe:
    tcpSocket:
      port: 8000
    failureThreshold: 30
    periodSeconds: 10

  livenessProbe:
    tcpSocket:
      port: 8000
    initialDelaySeconds: 90
    periodSeconds: 30
    failureThreshold: 3

  # User registration
  register:
    open_signup: true
    email_required: true
    email_verification: "optional"
    authentication_method: "username_email"

  # Caching
  memcached:
    enabled: true
    enabled_geonode: false
    backend: django.core.cache.backends.memcached.PyLibMCCache

  # Email (disabled for now)
  mail:
    enabled: false

  # Cleanup hook
  hooks:
    cleanupOnUpgrade: true

  # Node tolerations
  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

# ═══════════════════════════════════════════════════════════════════════════
# GEOSERVER (OGC Services)
# ═══════════════════════════════════════════════════════════════════════════
geoserver:
  image:
    name: geonode/geoserver
    tag: "2.27.4-latest"
  imagePullPolicy: IfNotPresent
  imagePullSecret: "rheticus-electric-towers-pull-secret"

  force_reinit: true

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 3Gi

  secret: 
    existingSecretName: "cnpg-geoserver-secret"
    data: 
      GEOSERVER_ADMIN_USER: rheticus_electric_tower/data/geoserver#GEOSERVER_ADMIN_USER
      GEOSERVER_ADMIN_PASSWORD: rheticus_electric_tower/data/geoserver#GEOSERVER_ADMIN_PASSWORD
      GEOSERVER_FACTORY_PASSWORD: rheticus_electric_tower/data/geoserver#GEOSERVER_FACTORY_PASSWORD
      OAUTH2_API_KEY: rheticus_electric_tower/data/geoserver#OAUTH2_API_KEY
      OAUTH2_CLIENT_ID: rheticus_electric_tower/data/geoserver#OAUTH2_CLIENT_ID
      OAUTH2_CLIENT_SECRET: rheticus_electric_tower/data/geoserver#OAUTH2_CLIENT_SECRET

  livenessProbe:
    httpGet:
      path: /geoserver/ows?service=wms&version=1.3.0&request=GetCapabilities
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5

  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

# ═══════════════════════════════════════════════════════════════════════════
# NGINX (Internal Reverse Proxy - required by chart)
# ═══════════════════════════════════════════════════════════════════════════
# NOTE: This is the INTERNAL nginx proxy, not the external ingress.
# Do NOT remove or disable this. It's required by GeoNode for internal routing.
nginx:
  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

# ═══════════════════════════════════════════════════════════════════════════
# PYCSW (CSW Catalog Service)
# ═══════════════════════════════════════════════════════════════════════════
pycsw:
  enabled: true
  replicaCount: 1
  image:
    name: geopython/pycsw
    tag: "3.0.0-beta2"
  imagePullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  readinessProbe:
    httpGet:
      path: /
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 5

  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

# ═══════════════════════════════════════════════════════════════════════════
# MEMCACHED (Distributed Cache)
# ═══════════════════════════════════════════════════════════════════════════
memcached:
  enabled: true
  replicaCount: 1
  config:
    memoryLimit: 96
    maxConnections: 2048

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

# ═══════════════════════════════════════════════════════════════════════════
# RABBITMQ (Message Broker for Async Tasks)
# ═══════════════════════════════════════════════════════════════════════════
rabbitmq:
  enabled: false
  replicaCount: 1

  persistence:
    enabled: true
    size: 2Gi

  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "750m"
    memory: "1Gi"

  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

# ═══════════════════════════════════════════════════════════════════════════
# REDIS (Optional - currently disabled, using Memcached instead)
# ═══════════════════════════════════════════════════════════════════════════
redis:
  enabled: false

# ═══════════════════════════════════════════════════════════════════════════
# APISIX ROUTING, TLS & WEB-GIS FRONTIEND MANIFEST INTEGRATION
# ═══════════════════════════════════════════════════════════════════════════
extraDeploy:
  # ─ 1. WEB-GIS CLUSTER INTERNAL SERVICE ─
  - apiVersion: v1
    kind: Service
    metadata:
      name: webgis
      namespace: rheticus-electric-towers
    spec:
      selector:
        app: webgis
      ports:
        - port: 80
          targetPort: 80
          name: http
      type: ClusterIP

  # ─ 2. WEB-GIS DASHBOARD APP DEPLOYMENT ─
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: webgis
      namespace: rheticus-electric-towers
      labels:
        app: webgis
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: webgis
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 25%
          maxUnavailable: 25%
      template:
        metadata:
          labels:
            app: webgis
        spec:
          imagePullSecrets:
            - name: rheticus-electric-towers-pull-secret
          tolerations:
            - key: "cluster"
              operator: "Equal"
              value: "rheticuset_cluster"
              effect: "NoSchedule"
          containers:
            - name: webgis
              image: harbor.planetek.it/rheticus_electric_towers/rheticus-electric-towers-web-gis:v1.0.1-patched
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 80
              env:
                - name: ADMIN_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: webgis-client-creds
                      key: ADMIN_USERNAME
                - name: ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: webgis-client-creds
                      key: ADMIN_PASSWORD
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
              readinessProbe:
                httpGet:
                  path: /
                  port: 80
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /
                  port: 80
                initialDelaySeconds: 10
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3

  # ─ 3. APISIX ROUTE RULES ─
  - apiVersion: apisix.apache.org/v2
    kind: ApisixRoute
    metadata:
      name: geonode-route-root
      namespace: rheticus-electric-towers
    spec:
      ingressClassName: apisix
      http:
        # ── PRIORITY 2: EVALUATED FIRST (SPECIFIC CORE DATA ENGINES) ──
        - name: geonode-backend
          priority: 2
          match:
            hosts:
              - relect.planetek.it
            paths:
              - "/geoserver/*"
              - "/geoserver/**"
              - "/api/*"
              - "/api/**"
              - "/static/*"
              - "/static/**"
              - "/uploaded/*"
              - "/uploaded/**"
          backends:
            - serviceName: rhet-dev-release-nginx
              servicePort: 80
          plugins:
            - name: proxy-rewrite
              enable: true
              config:
                headers:
                  X-Forwarded-Proto: "https"
                  X-Forwarded-Host: "relect.planetek.it"
        # ── PRIORITY 1: EVALUATED SECOND (FRONTEND FALLBACK) ──
        - name: webgis-root
          priority: 1
          match:
            hosts:
              - relect.planetek.it
            paths:
              - "/"
              - "/*"
          backends:
            - serviceName: webgis
              servicePort: 80
          plugins:
            - name: proxy-rewrite
              enable: true
              config:
                headers:
                  X-Forwarded-Proto: "https"
                  X-Forwarded-Host: "relect.planetek.it"

  # ─ 4. APISIX TLS RULES ─
  - apiVersion: apisix.apache.org/v2
    kind: ApisixTls
    metadata:
      name: geonode-tls
      namespace: rheticus-electric-towers
    spec:
      hosts:
        - relect.planetek.it
      ingressClassName: apisix
      secret:
        name: geonode-tls-secret
        namespace: rheticus-electric-towers


# ═══════════════════════════════════════════════════════════════════════════
# VAULT CONFIGURATION BLOCK
# ═══════════════════════════════════════════════════════════════════════════
vault: 
  secretStoreName: rhet-secret-store
  path: rheticus_electric_tower
  version: v2
  mountPath: kubernetes
  vaultRole: rheticus-electric-tower
  serviceAccount: vault-rheticus-electric-tower
  server: http://hashicorp-vault-planetek-dev.planetek-hashicorp-vault.svc.cluster.local:8200