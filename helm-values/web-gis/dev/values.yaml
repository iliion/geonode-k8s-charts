rabbitmq:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "500m"
  enabled: True
  persistence:
    enabled: true
    size: 2Gi
  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"

memcached:
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  config:
    memoryLimit: 96
  tolerations:
    - key: "cluster"
      operator: "Equal"
      value: "rheticuset_cluster"
      effect: "NoSchedule"
      
redis:
  enabled: false 

# ═══════════════════════════════════════════════════════════════════════════
# VAULT CONFIGURATION BLOCK
# ═══════════════════════════════════════════════════════════════════════════
vault: 
  secretStoreName: rhet-secret-store
  path: rheticus_electric_tower
  version: v2
  mountPath: kubernetes
  vaultRole: rheticus-electric-tower
  serviceAccount: vault-rheticus-electric-tower
  server: http://hashicorp-vault-planetek-dev.planetek-hashicorp-vault.svc.cluster.local:8200