apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-cnpg-geoserver-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.vault.secretStoreName }}
    kind: SecretStore
  target:
    name: cnpg-geoserver-secret
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: GEOSERVER_ADMIN_USER
      remoteRef:
        key: rheticus_electric_tower/data/geoserver
        property: GEOSERVER_ADMIN_USER
    - secretKey: GEOSERVER_ADMIN_PASSWORD
      remoteRef:
        key: rheticus_electric_tower/data/geoserver
        property: GEOSERVER_ADMIN_PASSWORD
    - secretKey: GEOSERVER_FACTORY_PASSWORD
      remoteRef:
        key: rheticus_electric_tower/data/geoserver
        property: GEOSERVER_FACTORY_PASSWORD
    - secretKey: OAUTH2_CLIENT_ID
      remoteRef:
        key: rheticus_electric_tower/data/geoserver
        property: OAUTH2_CLIENT_ID
    - secretKey: OAUTH2_CLIENT_SECRET
      remoteRef:
        key: rheticus_electric_tower/data/geoserver
        property: OAUTH2_CLIENT_SECRET
    - secretKey: OAUTH2_API_KEY
      remoteRef:
        key: rheticus_electric_tower/data/geoserver
        property: OAUTH2_API_KEY