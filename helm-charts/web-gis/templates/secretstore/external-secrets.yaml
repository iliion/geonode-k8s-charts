apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-cluster-pg-app
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.vault.secretStoreName }}
    kind: SecretStore
  target:
    name: cluster-pg-app
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: username
      remoteRef:
        key: rheticus_electric_tower/data/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: rheticus_electric_tower/data/postgres
        property: password
    - secretKey: postgres-password
      remoteRef:
        key: rheticus_electric_tower/data/postgres
        property: password
    - secretKey: geonode-password
      remoteRef:
        key: rheticus_electric_tower/data/geonode
        property: password
    - secretKey: geodata-password
      remoteRef:
        key: rheticus_electric_tower/data/geodata
        property: password

---

