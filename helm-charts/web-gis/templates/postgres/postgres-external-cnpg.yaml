{{- if .Values.postgres.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: "{{ include "cnpg_pod_name" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    cluster: rheticuset_cluster
spec:
  # Image with PostGIS
  imageName: {{ .Values.postgres.cnpg.imageName }}

  # Number of instances (replicas)
  instances: {{ .Values.postgres.cnpg.instances }}

  # Primary update strategy
  primaryUpdateStrategy: unsupervised
  
  postgresql:
    parameters:
      # Memory allocation (Quoted where numbers might be interpreted as raw integers)
      max_connections: {{ .Values.postgres.cnpg.postgresql.parameters.max_connections | default "100" | quote }}
      shared_buffers: {{ .Values.postgres.cnpg.postgresql.parameters.shared_buffers | default "128MB" }}
      work_mem: {{ .Values.postgres.cnpg.postgresql.parameters.work_mem | default "4MB" }}
      maintenance_work_mem: {{ .Values.postgres.cnpg.postgresql.parameters.maintenance_work_mem | default "64MB" }}
      
      # Logging
      log_statement: {{ .Values.postgres.cnpg.postgresql.parameters.log_statement | default "mod" }}          # Log DDL and DML statements
      log_duration: {{ .Values.postgres.cnpg.postgresql.parameters.log_duration | default "on" }}            # Log statement duration
      log_min_duration_statement: {{ .Values.postgres.cnpg.postgresql.parameters.log_min_duration_statement | default "1000" | quote }}  # Log slow queries (>1sec)

      # Vacuum settings
      autovacuum: {{ .Values.postgres.cnpg.postgresql.parameters.autovacuum | default "on" }}
      autovacuum_max_workers: {{ .Values.postgres.cnpg.postgresql.parameters.autovacuum_max_workers | default "3" | quote }}

      # Inject custom logging and autovacuum values passed through values.yaml
      {{- if and .Values.postgres.cnpg.postgresql .Values.postgres.cnpg.postgresql.parameters }}
        {{- toYaml .Values.postgres.cnpg.postgresql.parameters | nindent 6 }}
      {{- end }}

  # Storage configuration
  storage:
    size: {{ .Values.postgres.cnpg.storage.size }}
    storageClass: {{ .Values.postgres.cnpg.storage.storageClass | default .Values.global.storageClass }}

  # Resources
  resources:
    requests:
      cpu: {{ .Values.postgres.cnpg.resources.requests.cpu }}
      memory: {{ .Values.postgres.cnpg.resources.requests.memory }}
    limits:
      cpu: {{ .Values.postgres.cnpg.resources.limits.cpu }}
      memory: {{ .Values.postgres.cnpg.resources.limits.memory }}

  # Pod scheduling/placement (CNPG puts tolerations inside topology)
  {{- with .Values.postgres.tolerations }}
  affinity:
    tolerations:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  
  # Bootstrap database initialization
  bootstrap:
    initdb:
      database: {{ .Values.postgres.bootstrap.initdb.database | default "app" }}
      owner: {{ .Values.postgres.bootstrap.initdb.owner | default "app" }}
      secret:
        name: {{ .Values.postgres.secret.existingSecretName | default "cluster-pg-app" }}
      # # Create secondary databases
      # postInitApplicationSQL:
      #   - CREATE DATABASE geonode;
      #   - CREATE DATABASE geodata;
      # # Create PostGIS extensions in template1 so all databases can use them
      # postInitSQL:
      #   - CREATE EXTENSION IF NOT EXISTS postgis;
      #   - CREATE EXTENSION IF NOT EXISTS postgis_topology;
      #   - CREATE EXTENSION IF NOT EXISTS postgres_fdw;

  # Define and manage the secondary users natively via CNPG Role Management
  managed:
    roles:
      - name: geonode
        ensure: present
        login: true
        passwordSecret:
          name: cnpg-geonode-secret
      - name: geodata
        ensure: present
        login: true
        passwordSecret:
          name: cnpg-geodata-secret


  monitoring: 
    customQueriesConfigMap: 
      - key: queries  
        name: cnpg-default-monitoring 
    disableDefaultQueries: false  
    enablePodMonitor: false
{{- end }}